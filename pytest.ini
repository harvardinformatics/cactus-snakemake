[pytest]
pythonpath = .
testpaths = tests
norecursedirs = .* __pycache__ tests/evolverMammals tests/yeast-minigraph
markers =
    prep: needs singularity and a local Cactus image; runs real prep steps and Snakemake dry-runs (tier 2)
    e2e: full Cactus pipeline runs; opt-in via CACTUS_SMK_RUN_E2E=1, run inside a SLURM allocation (tier 3)

#############################################################################
# This config file is a necessary input file for the Cactus replace-genome Snakemake
# pipeline: cactus_replace_genome.smk. It contains the parameters needed to run the pipeline.
#
# This pipeline uses the replace method to replace a genome in an existing HAL file.
# https://github.com/ComparativeGenomicsToolkit/cactus/blob/master/doc/cactus-update-prepare.md#replacing-a-genome
#############################################################################

# Test config for the replace-genome pipeline on the evolverMammals dataset. Run it from tests/evolverMammals/,
# since the paths below are relative to that directory:
#   ../../cactus_snakemake prep replace-genome --configfile evolverMammals-replace-genome-cfg.yaml
#   ../../cactus_snakemake run replace-genome --configfile evolverMammals-replace-genome-cfg.yaml -j 20 -e slurm --dryrun
# It starts from the HAL the align test writes (evolverMammals-align-out/), so run that first.

#############################################################################
#
# Below are the parameters you need to set for the cactus snakemake pipeline.
#

cactus_path: download
# File path, version tag (e.g. v3.3.0), or "download".
# Provide the path to the cactus singularity container. This is needed whether use_gpu is True or False.
# With use_gpu: True, a version tag or "download" gets the GPU build of that version (don't add -gpu
# yourself), and a file path must point to a GPU image.
# If you don't have it, set this to "download" and prep will download it for you (once; every run then uses that image).
# To download a specific version, give its full version tag, e.g. v3.3.0 or 3.3.0 (not 3.3, which YAML
# reads as a number). Cactus v3.0.0 or later is required.

singularity_bind_paths:
# Optional YAML list of extra Singularity bind paths to add to every container command.
# Each entry must use src[:dest[:opts]] format, e.g. /nfs6:/nfs6 or /scratch:/scratch:rw
# Leave blank or set to [] to use the cluster defaults only.

input_hal: evolverMammals-align-out/evolverMammals.hal
# File path.
# The input HAL file. This is the output of a previous cactus run.

replace: simHuman_chr6
# String.
# The genome in the input hal file to be replaced

new_genome_fasta: evolverMammals-seq/simGorilla.chr6
# File path.
# The path to the genome file to be added to the HAL file.

new_genome_name: simGorilla_chr6
# String.
# The name the replacement genome will have in the HAL file. It can be the same as the genome
# being replaced (set in 'replace') or a new name; Cactus v3.0.0 and later allow either.

output_dir: evolverMammals-replace-genome-out/
# Directory path.
# The output directory for the snakemake pipeline. Prep also writes its files here, including prep-manifest.yaml.
# This directory will be created if it doesn't exist.

overwrite_original_hal: False
# True/False
# Whether or not to overwrite the original HAL file (True) or make a copy and use it (False).
# If a copy is made (False), you don't risk corrupting the original HAL file, but you will
# use twice as much disk space.

final_prefix: evolverMammals-replace-genome
# String.
# The prefix for the final output files. This will be used to name the final HAL file and the final MAF files.

maf_reference: simGorilla_chr6
# String.
# The desired reference genome for the MAF files.

maf_include_anc: False
# True/False.
# Whether to include the ancestral genomes in the MAF files. If False (the default), they are
# left out (cactus-hal2maf --noAncestors).

tmp_dir: evolverMammals-replace-genome-tmp/
# Directory path.
# A temporary directory for snakemake and cactus to use. Should have lots of space.

use_gpu: False
# True/False
# Whether or not to use the GPU version of cactus.
# If you don't have a GPU partition, set this to False.
# Either way, be sure to set the correct values for the partitions and GPUs below.

#############################################################################
## Below are the partitions and resources for each rule in the snakemake pipeline.
## Be sure to adjust them to meet your needs and the resources available on your cluster.
## Notably, for rule blast, if you use the GPU version of cactus you will need to
## provide a partition with GPUs and set exactly one of the two options below:
##   gpus: number of GPUs to request through Snakemake's gpu resource
##   gres: GPU GRES request in any of these forms: 1, a100:2, gpu:1, gpu:a100:2
##         If gpu: is omitted, the pipeline will add it.
## If you are not using the cactus GPU version, both values will be ignored.
##
## The default: block fills in any value that a rule's own entry leaves blank, and is used in
## full for rules that have no entry of their own.
##
## mem_mb is in MB
## time is in minutes
## Any resource except gpus and gres can be either a single value or a YAML list of per-attempt values.
## If a list is provided, attempt 1 uses the first value, attempt 2 the second, etc.,
## and attempts beyond the list length reuse the last value.
## This requires Snakemake retries, e.g. --retries 3.
## Example:
##   blast:
##     mem_mb: [80000, 160000, 200000]
##     time: [1660, 3320, 6640, 7200]
##
## If you run with -e slurm --slurm-partition-config <path to your cluster's partition config>, partition names can be left blank.

rule_resources:
  default:
    partition:
    mem_mb: 4000
    cpus: 1
    gpus: 0
    time: 60

  preprocess:
    partition:
    mem_mb: 25000
    cpus: 8
    time: 30

  blast:
    partition: # If use_gpu is True, this must be a partition with GPUs
    mem_mb: 25000
    cpus: 24
    gpus: 1 # Use this for Snakemake's gpu resource; do not set together with gres
    gres:           # Use this for Snakemake's gres resource, e.g. 1, a100:2, gpu:1, or gpu:a100:2
    time: 30

  align:
    partition:
    mem_mb: 25000
    cpus: 24
    time: 30

  copy_or_get_hal:
    partition:
    mem_mb: 8000
    cpus: 1
    time: 30

  remove_genome:
    partition:
    mem_mb: 8000
    cpus: 1
    time: 30

  replace_genome:
    partition:
    mem_mb: 8000
    cpus: 1
    time: 30

  maf:
    partition:
    mem_mb: 25000
    cpus: 8
    time: 30
